<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menu de Exercícios</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-900 flex items-center justify-center min-h-screen font-sans">

    <div class="max-w-md w-full p-6 bg-slate-800 rounded-2xl shadow-2xl border border-slate-700">
        <header class="text-center mb-8">
            <h1 class="text-3xl font-bold text-white mb-2">Meus Exercícios</h1>
            <p class="text-slate-400 text-sm">Selecione um projeto abaixo para visualizar</p>
        </header>
        <div id="data-hora" class="text-[0.8rem] text-slate-400 text-center mb-4 italic border-b border-slate-700 pb-2">
        </div>

        <nav class="space-y-4">
            <a href="Exercicio 1/index.html"
                class="flex items-center justify-between p-4 bg-slate-700 hover:bg-indigo-600 rounded-xl transition-all duration-300 group">
                <span class="text-white font-medium">Cálculo de horas extras</span>
                <svg xmlns="http://www.w3.org/2000/svg"
                    class="h-5 w-5 text-slate-400 group-hover:text-white transform group-hover:translate-x-1 transition-transform"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </a>

            <a href="Exercicio 2/index.html"
                class="flex items-center justify-between p-4 bg-slate-700 hover:bg-emerald-600 rounded-xl transition-all duration-300 group">
                <span class="text-white font-medium">Cálculo de Aumento de salário</span>
                <svg xmlns="http://www.w3.org/2000/svg"
                    class="h-5 w-5 text-slate-400 group-hover:text-white transform group-hover:translate-x-1 transition-transform"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </a>

            <a href="Exercicio 3/index.html"
                class="flex items-center justify-between p-4 bg-slate-700 hover:bg-orange-600 rounded-xl transition-all duration-300 group">
                <span class="text-white font-medium">Cálculo de Transporte de colaboradores</span>
                <svg xmlns="http://www.w3.org/2000/svg"
                    class="h-5 w-5 text-slate-400 group-hover:text-white transform group-hover:translate-x-1 transition-transform"
                    fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7" />
                </svg>
            </a>
        </nav>

        <footer class="mt-8 text-center">
            <span class="text-xs text-slate-500 uppercase tracking-widest font-semibold">Portifólio de João
                Victor</span>
        </footer>
    </div>
    <script>
        function atualizarRelogio() {
            // 1. Criamos uma nova instância do objeto Date (pega o agora)
            const agora = new Date();

            // 2. Formatamos a data para o padrão brasileiro (dia/mes/ano)
            const dataFormatada = agora.toLocaleDateString('pt-BR');

            // 3. Formatamos a hora para o padrão brasileiro (00:00:00)
            const horaFormatada = agora.toLocaleTimeString('pt-BR');

            // 4. Selecionamos o elemento HTML onde queremos exibir a informação
            const elementoDataHora = document.getElementById("data-hora");

            // 5. Inserimos o texto formatado dentro do elemento
            elementoDataHora.innerHTML = `Hoje é ${dataFormatada} | ${horaFormatada}`;
        }

        // Executamos a função assim que a página carrega
        atualizarRelogio();

        // (Opcional) Fazemos o relógio atualizar a cada 1 segundo (1000 milissegundos)
        setInterval(atualizarRelogio, 1000);</script>
</body>

</html>
